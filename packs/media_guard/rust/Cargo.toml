[package]
name = "media_guard"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
