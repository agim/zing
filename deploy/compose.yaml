# Run from the repository root: docker compose --env-file .env.production -f deploy/compose.yaml up --build -d
services:
  app:
    build: ..
    restart: unless-stopped
    read_only: true
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    healthcheck:
      test: ['CMD', '/app/zing-healthcheck']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    env_file: ../.env.production
    environment:
      LIDZA_ADDR: 0.0.0.0:3000
      DATABASE_URL: postgres://zing:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/zing?sslmode=disable
      CACHE_URL: redis://valkey:6379/0
      REALTIME_BUS_URL: redis://valkey:6379/1
      DB_MIGRATE: 'true'
      AUTH_OWNER_CLAIM: 'true'
      AUTH_COOKIE_SECURE: 'true'
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
    volumes: ['owner-claim:/app/config/owner-claim', 'storage:/app/storage']
  postgres:
    image: zing-postgres:17-security.1
    build: ../services/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zing
      POSTGRES_USER: zing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U zing -d zing -Atc "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      retries: 20
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes']
    volumes: ['valkey:/data']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres:
  valkey:
  owner-claim:
  storage:
